<p class="eyebrow">DISPATCH REQUEST / 04</p>
<h1>후원 정보 입력</h1>
<p class="lead">전달에 필요한 정보만. 질문은 적게, 지원은 조용히.</p>
<p class="notice">모의 주문입니다. 실제 결제·후원·배송은 발생하지 않으며, 입력 정보는 저장하거나 전송하지 않습니다.</p>
<form class="pay" id="pay-form">
<h2>01 / 받는 분</h2>
<label for="buyer">이름</label>
<input id="buyer" name="buyer" autocomplete="name" required placeholder="받는 분의 이름">
<label for="addr">보급 받을 주소</label>
<input id="addr" name="addr" autocomplete="street-address" required placeholder="도로명 주소와 상세 주소">
<label for="phone">연락처</label>
<input id="phone" name="phone" type="tel" autocomplete="tel" required placeholder="010-0000-0000">
<h2>02 / 전달 방식 확인</h2>
<p class="lead">일반 택배 · 주문 확인 후 영업일 기준 2일 이내 발송</p>
<div id="checkout-summary">
</div>
<div class="total">이번 지원 합계 <span id="pay-total">0원</span>
</div>
<button class="btn" type="submit">모의 후원 접수하기 ↗</button>
